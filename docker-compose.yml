services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9123:8000"        # host:container (9123 avoids the reserved-port problem)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    environment:
      API_URL: http://api:8000     # containers talk to each other by service name
    ports:
      - "9124:8501"
    depends_on:
      api:
        condition: service_healthy